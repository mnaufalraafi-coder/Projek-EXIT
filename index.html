<!DOCTYPE html>
<html lang="id">
<head>
<script>
if (!localStorage.getItem('exit_session')) location.replace('login.html');
document.addEventListener('DOMContentLoaded', () => {
  let user = {};
  try { user = JSON.parse(localStorage.getItem('exit_session')) || {}; } catch (e) {}
  const b = document.createElement('button');
  b.className = 'out';
  b.textContent = 'Keluar' + (user.nama ? ' (' + user.nama + ')' : '');
  b.onclick = () => { localStorage.removeItem('exit_session'); location.replace('login.html'); };
  document.querySelector('nav').appendChild(b);
});
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXIT - Your Investment, Your Exit</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== PALET WARNA (sama dengan login.html) ===== */
:root{
  --bg:#F4EFE8;        /* krem, latar halaman */
  --bar:#FAF7F2;      /* krem terang, header */
  --card:#FFFDF9;     /* kartu putih hangat */
  --ink:#0A1B2E;      /* navy tua, teks utama */
  --mut:#5F6B7A;      /* teks pendukung */
  --line:#E6DFD3;     /* garis tepi */
  --navy:#071A2D;     /* kartu hero gelap */
  --gold:#B5762E;     /* emas tua */
  --gold2:#CFA05A;    /* emas muda */
  --note-bg:#F5E2C2;  /* banner prototipe */
  --note-ink:#6B3F0F; /* teks banner */
  --tag-bg:#F3E6CF;   /* label jenis */
  --red:#B3412F;
  --green:#2E7D4F;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

header{background:var(--bar);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.logo{font-family:'Cormorant SC',Georgia,serif;font-weight:700;font-size:32px;line-height:1;letter-spacing:1px;color:var(--navy)}
.logo small{display:block;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:13px;font-weight:400;letter-spacing:0;color:var(--mut);margin-top:4px}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--line);color:var(--ink);padding:9px 18px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
nav button:hover{border-color:var(--gold)}
nav button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
nav button.out{background:linear-gradient(90deg,var(--gold2),var(--gold));border:0;color:var(--navy);font-weight:700}
nav button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}

.note{background:var(--note-bg);color:var(--note-ink);border-bottom:1px solid #E8CFA5;padding:14px 32px;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.6}
.note svg{margin-top:2px}

main{max-width:1100px;margin:0 auto;padding:32px 16px 60px}
h2{font-size:22px;font-weight:800;margin-bottom:4px}
.sub{color:var(--mut);margin-bottom:18px}

.hero{background:var(--navy);color:#F3EEE6;border-radius:28px;padding:44px 48px;margin-bottom:32px}
.hero h1{font-family:'Cormorant SC',Georgia,serif;font-weight:700;font-size:42px;line-height:1.1;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:14px;max-width:760px;font-size:17px;line-height:1.7;color:#C9CFD8}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.hero .btn{margin-top:0;display:flex;align-items:center;gap:10px;padding:13px 24px}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.card h3{font-size:16px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.row span:first-child{color:var(--mut)}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--tag-bg);color:var(--note-ink);margin-bottom:8px}
.risk{font-weight:700}

.btn{margin-top:12px;background:linear-gradient(90deg,var(--gold2),var(--gold));color:var(--navy);border:0;border-radius:999px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.alt{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.sum .card b{font-size:24px;display:block}
.sum .card span{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:20px;padding:20px;margin-top:16px}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:20px}

.steps{display:flex;gap:0;margin:14px 0;flex-wrap:wrap}
.step{flex:1;min-width:110px;padding:10px 8px;text-align:center;font-size:13px;background:#EDE7DC;color:var(--mut);border-right:2px solid var(--bg)}
.step:first-child{border-radius:999px 0 0 999px}
.step:last-child{border-radius:0 999px 999px 0;border-right:0}
.step.done{background:var(--navy);color:#fff}
.step.now{background:linear-gradient(90deg,var(--gold2),var(--gold));color:var(--navy);font-weight:700}

.hide{display:none}
select,input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}

@media (max-width:720px){
  header,.note{padding-left:20px;padding-right:20px}
  .hero{padding:30px 24px;border-radius:24px}
  .hero h1{font-size:32px}
}
</style>
</head>
<body>
<header>
  <div class="logo">EXIT<small id="crumb">Investor App / Portofolio</small></div>
  <nav aria-label="Menu utama">
    <button data-v="dash" class="on">Portofolio</button>
    <button data-v="market">Pasar Pengalihan</button>
    <button data-v="track">Status Pengalihan</button>
  </nav>
</header>

<div class="note" role="note">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
  <span><b>Mode prototipe:</b> prototipe untuk tugas Inovasi Keuangan Digital. Seluruh data adalah data contoh dan tidak ada transaksi nyata.</span>
</div>

<main>
  <section id="dash"></section>
  <section id="market" class="hide"></section>
  <section id="track" class="hide"></section>
</main>

<script>
const rp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const riskLabel = r => ({1:'Rendah',2:'Sedang',3:'Tinggi'})[r];
const riskColor = r => ({1:'var(--green)',2:'var(--gold)',3:'var(--red)'})[r];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

let sesi = {};
try { sesi = JSON.parse(localStorage.getItem('exit_session')) || {}; } catch (e) {}

// Data contoh posisi investasi milik investor (existing investor)
let positions = [
  {id:1, nama:'Pendanaan Invoice PT Sinar Jaya', jenis:'P2P Lending', nominal:10000000, imbal:12, sisa:75, risk:1, status:'aktif'},
  {id:2, nama:'Obligasi Urunan Kedai Kopi Senja', jenis:'SCF', nominal:5000000, imbal:14, sisa:120, risk:2, status:'aktif'},
  {id:3, nama:'Pendanaan Modal Kerja CV Tani Makmur', jenis:'P2P Lending', nominal:7500000, imbal:16, sisa:45, risk:3, status:'aktif'}
];
// Daftar posisi yang tersedia di pasar (dari investor lain)
let listings = [
  {id:101, nama:'Pendanaan Armada PT Logistik Nusa', jenis:'P2P Lending', harga:9650000, nominal:10000000, imbal:13, sisa:60, risk:1, milikSaya:false},
  {id:102, nama:'Saham Urunan Resto Bahari', jenis:'SCF', harga:4780000, nominal:5000000, imbal:15, sisa:90, risk:2, milikSaya:false}
];
let tracking = []; // proses pengalihan milik saya

// Valuasi sederhana: diskon bergantung pada risiko dan sisa tenor
function valuasi(p){
  const diskon = 0.005 + p.risk*0.004 + (p.sisa/30)*0.001;
  return {diskon, harga:p.nominal*(1-diskon)};
}

const JUDUL = {dash:'Portofolio', market:'Pasar Pengalihan', track:'Status Pengalihan'};
function show(v){
  ['dash','market','track'].forEach(id=>document.getElementById(id).classList.toggle('hide',id!==v));
  document.querySelectorAll('nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.getElementById('crumb').textContent = 'Investor App / ' + JUDUL[v];
  render();
}
document.querySelectorAll('nav button[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));

function rows(p){return `
  <div class="row"><span>Nominal</span><b>${rp(p.nominal)}</b></div>
  <div class="row"><span>Imbal hasil</span><span>${p.imbal}% / tahun</span></div>
  <div class="row"><span>Sisa tenor</span><span>${p.sisa} hari</span></div>
  <div class="row"><span>Skor risiko</span><span class="risk" style="color:${riskColor(p.risk)}">${riskLabel(p.risk)}</span></div>`}

function renderDash(){
  const total = positions.reduce((a,p)=>a+p.nominal,0);
  const aktif = positions.filter(p=>p.status==='aktif');
  let h = `
  <div class="hero">
    <h1>Selamat datang, ${esc(sesi.nama || 'Investor')}</h1>
    <p>EXIT mempertemukan investor yang ingin keluar dari posisi investasinya lebih awal dengan investor yang bersedia mengambil alih, secara terstruktur dan transparan.</p>
    <div class="acts">
      <button class="btn" onclick="show('market')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
        Jelajahi Pasar
      </button>
      <button class="btn ghost" onclick="show('track')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        Status Pengalihan
      </button>
    </div>
  </div>
  <h2>Portofolio saya</h2><p class="sub">Pilih posisi yang ingin dialihkan sebelum jatuh tempo.</p>
  <div class="sum">
    <div class="card"><b>${rp(total)}</b><span>Total posisi investasi</span></div>
    <div class="card"><b>${aktif.length}</b><span>Posisi aktif</span></div>
    <div class="card"><b>${tracking.length}</b><span>Pengalihan berjalan</span></div>
  </div><div class="grid">`;
  positions.forEach(p=>{
    h += `<div class="card"><span class="tag">${p.jenis}</span><h3>${p.nama}</h3>${rows(p)}
    ${p.status==='aktif'
      ? `<button class="btn" onclick="openValuasi(${p.id})">Alihkan posisi</button>`
      : `<button class="btn ghost" disabled>Sedang dialihkan</button>`}</div>`;
  });
  h += `</div><div id="valuasiBox"></div>`;
  dash.innerHTML = h;
}

function openValuasi(id){
  const p = positions.find(x=>x.id===id), v = valuasi(p);
  document.getElementById('valuasiBox').innerHTML = `
  <div class="panel"><h3>Hasil valuasi: ${p.nama}</h3>
    <p class="sub">Verifikasi posisi selesai. Berikut estimasi harga pengalihan.</p>
    <div class="row"><span>Nominal posisi</span><b>${rp(p.nominal)}</b></div>
    <div class="row"><span>Diskon pengalihan</span><span>${(v.diskon*100).toFixed(2)}%</span></div>
    <div class="row"><span>Estimasi harga pengalihan</span><b>${rp(v.harga)}</b></div>
    <label for="harga">Harga yang Anda tawarkan</label>
    <input id="harga" type="number" value="${Math.round(v.harga)}" min="1">
    <button class="btn" onclick="listkan(${p.id})">Tawarkan ke investor lain</button>
    <button class="btn ghost" onclick="document.getElementById('valuasiBox').innerHTML=''">Batal</button>
  </div>`;
  document.getElementById('valuasiBox').scrollIntoView({behavior:'smooth'});
}

function listkan(id){
  const p = positions.find(x=>x.id===id);
  const harga = Number(document.getElementById('harga').value)||valuasi(p).harga;
  p.status='dialihkan';
  listings.unshift({id:200+id, nama:p.nama, jenis:p.jenis, harga, nominal:p.nominal, imbal:p.imbal, sisa:p.sisa, risk:p.risk, milikSaya:true, posId:id});
  tracking.push({posId:id, nama:p.nama, harga, tahap:2}); // 0 verifikasi,1 valuasi,2 matching,3 settlement,4 selesai
  show('market');
}

function renderMarket(){
  let h = `<h2>Pasar pengalihan</h2><p class="sub">Posisi investasi yang ditawarkan investor lain. Sistem mencocokkan sesuai profil risiko Anda.</p>
  <label for="prof">Profil risiko saya</label>
  <select id="prof" onchange="renderMarket()" style="max-width:260px">
    <option value="3">Berani (semua risiko)</option>
    <option value="2">Moderat (hingga sedang)</option>
    <option value="1">Konservatif (rendah saja)</option>
  </select><div class="grid" style="margin-top:14px">`;
  const sel = document.getElementById('prof');
  const maks = sel ? Number(sel.value) : 3;
  const cocok = listings.filter(l=>!l.milikSaya && l.risk<=maks);
  const milik = listings.filter(l=>l.milikSaya);
  [...cocok,...milik].forEach(l=>{
    const hemat = ((1-l.harga/l.nominal)*100).toFixed(1);
    h += `<div class="card"><span class="tag">${l.jenis}${l.milikSaya?' - milik saya':''}</span><h3>${l.nama}</h3>${rows(l)}
    <div class="row"><span>Harga pengalihan</span><b>${rp(l.harga)}</b></div>
    <div class="row"><span>Diskon dari nominal</span><span>${hemat}%</span></div>
    ${l.milikSaya
      ? `<button class="btn ghost" disabled>Menunggu investor baru</button>
         <button class="btn alt" onclick="simulasiBeli(${l.posId})">Simulasi: investor baru mengambil alih</button>`
      : `<button class="btn" onclick="ambilAlih(${l.id})">Ambil alih posisi</button>`}</div>`;
  });
  h += '</div>';
  if(!cocok.length) h += `<div class="empty" style="margin-top:14px">Belum ada posisi yang cocok dengan profil risiko ini. Ubah profil risiko untuk melihat lainnya.</div>`;
  const keep = sel ? sel.value : '3';
  market.innerHTML = h;
  document.getElementById('prof').value = keep;
}

function ambilAlih(id){
  const l = listings.find(x=>x.id===id);
  listings = listings.filter(x=>x.id!==id);
  alert('Posisi "'+l.nama+'" berhasil diambil alih seharga '+rp(l.harga)+'. (Simulasi)');
  renderMarket();
}

function simulasiBeli(posId){
  const t = tracking.find(x=>x.posId===posId);
  t.tahap = 3;
  show('track');
}

function renderTrack(){
  const nama = ['Verifikasi','Valuasi','Matching','Settlement','Selesai'];
  let h = `<h2>Status pengalihan</h2><p class="sub">Pantau proses pengalihan posisi Anda dari awal sampai dana diterima.</p>`;
  if(!tracking.length) h += `<div class="empty">Belum ada pengalihan. Pilih posisi di menu Portofolio, lalu klik "Alihkan posisi".</div>`;
  tracking.forEach(t=>{
    h += `<div class="card" style="margin-bottom:14px"><h3>${t.nama}</h3>
    <div class="row"><span>Harga pengalihan</span><b>${rp(t.harga)}</b></div><div class="steps">`;
    nama.forEach((n,i)=>{
      h += `<div class="step ${i<t.tahap||t.tahap===4?'done':i===t.tahap?'now':''}">${n}</div>`;
    });
    h += `</div>`;
    if(t.tahap===3) h += `<button class="btn alt" onclick="selesai(${t.posId})">Simulasi: konfirmasi settlement</button>`;
    if(t.tahap===2) h += `<p class="sub">Menunggu investor baru. Buka Pasar Pengalihan untuk simulasi.</p>`;
    if(t.tahap===4) h += `<p style="color:var(--green);font-weight:700;margin-top:8px">Pengalihan selesai. Dana ${rp(t.harga)} diteruskan ke rekening Anda.</p>`;
    h += `</div>`;
  });
  track.innerHTML = h;
}

function selesai(posId){
  tracking.find(x=>x.posId===posId).tahap = 4;
  positions = positions.filter(p=>p.id!==posId);
  listings = listings.filter(l=>l.posId!==posId);
  renderTrack();
}

function render(){renderDash();renderMarket();renderTrack();}
render();
</script>
</body>
</html>
